<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photography Mode - Auto-Lister</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body class="camera-body">
    <div class="camera-container">
        <!-- Header -->
        <header class="camera-header">
            <button id="backBtn" class="icon-btn" aria-label="Back">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"
                    stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <div class="header-title">Photography Mode</div>
            <div class="photo-count"><span id="currentGroupCount">0</span> photos</div>
        </header>

        <!-- Viewfinder -->
        <main class="viewfinder-container">
            <video id="cameraStream" autoplay playsinline></video>
        </main>

        <!-- Gallery Preview (thumbnails of current group) -->
        <div class="camera-gallery" id="cameraGallery">
            <!-- Thumbnails inserted here -->
        </div>

        <!-- Controls -->
        <footer class="camera-controls">
            <button id="doneBtn" class="secondary-btn controls-btn">Done with Item</button>

            <!-- Shutter Button / Native Camera Trigger -->
            <div class="shutter-wrapper">
                <!-- PRO Button for native camera selection -->
                <button id="proBtn" class="shutter-btn pro-btn" title="Choose Source / PRO Mode">PRO</button>
                <input type="file" id="highQualCameraInput" accept="image/*" style="display: none;">

                <label for="nativeCameraInput" class="shutter-btn" id="shutterLabel" title="Take Photo">
                    <!-- Camera Icon SVG -->
                    <svg viewBox="0 0 24 24" width="32" height="32" stroke="currentColor" stroke-width="2" fill="none"
                        stroke-linecap="round" stroke-linejoin="round" style="color: #666;">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                        </path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                </label>
                <input type="file" id="nativeCameraInput" accept="image/*" capture style="display: none;">

                <!-- JS Shutter for getUserMedia (hidden if not using stream) -->
                <button id="captureBtn" class="shutter-btn" style="display: none;"></button>
            </div>

            <button id="finishBtn" class="primary-btn controls-btn">Finish & Review</button>
        </footer>

        <!-- Info message for Native Mode -->
        <div id="nativeInfo" class="native-info" style="display: none;">
            Snap a photo to add it to the item.
        </div>
    </div>

    <script src="camera.js"></script>
</body>

</html>
